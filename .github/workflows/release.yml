name: Build WordPress plugin release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4

      - name: Verify tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(sed -n 's/^ \* Version: //p' on-model-commerce.php | head -1)"
          test "v${plugin_version}" = "${GITHUB_REF_NAME}"

      - name: Build canonical plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/on-model-commerce-github
          cp on-model-commerce.php readme.txt build/on-model-commerce-github/
          cd build
          zip -r -X ../on-model-commerce.zip on-model-commerce-github

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          on-model-commerce.zip
          --generate-notes
          --title "Style by REii Commerce ${GITHUB_REF_NAME}"
